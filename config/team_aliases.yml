# Team-name normalisation.
#
# Sources name the same club differently: the football-data mirror uses short
# names ("Man City"), openfootball uses official long names ("Manchester City
# FC"). Unifying them matters because Elo and form ratings have to follow a
# club across competitions - Real Madrid's league form must inform its
# Champions League prediction.
#
# Fuzzy matching was evaluated and rejected: on this data it produced
# Celtic FC -> Celta, FC Porto -> Portsmouth and PSV Eindhoven -> Swindon.
# Mappings are therefore explicit and reviewed.
#
#   canonical_name:
#     - alias as written by some source
#
# Names not listed here fall back to rule-based cleaning (accent folding plus
# corporate-suffix stripping). That is safe for clubs that appear in only one
# source; run `python scripts/check_names.py` to list unmapped names that
# appear in more than one competition.

canonical:

