    source: openfootball_txt
    source_key: conference-league
    enabled: false

  - code: UEFA_SC
    name: UEFA Super Cup
    country: INT
    tier: 2
    format: knockout
    neutral_venue: true
    source: openfootball_txt
    source_key: null
    enabled: false

  # ---------------------------------------------------------- International
  - code: FIFA_WC
    name: FIFA World Cup
    country: INT
    tier: 1
    format: group_then_knockout
    neutral_venue: true
    source: openfootball_txt
    source_key: world-cup
    source_file: cup
    season_dirs: ["2014--brazil", "2018--russia", "2022--qatar"]
    enabled: false

  - code: UEFA_EURO
    name: UEFA European Championship
    country: INT
    tier: 1
    format: group_then_knockout
    neutral_venue: true
    source: openfootball_txt
    source_key: euro
    source_file: euro
    season_dirs: ["2016--france", "2020--europe", "2024--germany"]
    enabled: false

  - code: CONMEBOL_CA
    name: Copa America
    country: INT
    tier: 1
