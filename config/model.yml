# Model and validation configuration.

elo:
  start_rating: 1500.0
  k_factor: 20.0
  home_advantage: 65.0        # in Elo points, fitted on training data
  goal_diff_scaling: true     # World Football Elo goal-difference multiplier
  season_regression: 0.25     # fraction pulled back to the mean between seasons
  competition_k:              # importance multipliers on K
    default: 1.0
    UEFA_UCL: 1.15
    UEFA_UEL: 1.10
    FIFA_WC: 1.25

dixon_coles:
  # Exponential time decay: w = exp(-xi * days_since_match)
  xi: 0.0018                  # ~0.0018/day => half-life around 385 days
  max_history_days: 1460      # four seasons of history per fit
  rho_bounds: [-0.25, 0.25]
  max_goals: 12               # score-matrix truncation
  min_matches_per_team: 5

poisson:
  xi: 0.0018
  max_history_days: 1460
  max_goals: 12

halves:
  # First and second halves are fitted as separate Dixon-Coles models rather
  # than splitting the full-time rates. See docs/RESEARCH.md section 7.
  enabled: true
  xi: 0.0018
  max_goals: 8

ml:
  random_state: 42
  logistic:
    C: 0.35
    max_iter: 2000
  random_forest:
    n_estimators: 500
    max_depth: 9
    min_samples_leaf: 40
    n_jobs: -1
  xgboost:
    n_estimators: 420
    max_depth: 4
    learning_rate: 0.035
    subsample: 0.85
    colsample_bytree: 0.75
    min_child_weight: 12
    reg_lambda: 2.5
  lightgbm:
    n_estimators: 480
    num_leaves: 20
    learning_rate: 0.035
    min_child_samples: 45
    subsample: 0.85
    colsample_bytree: 0.75
    reg_lambda: 2.5
  catboost:
    iterations: 500
    depth: 5
    learning_rate: 0.04
    l2_leaf_reg: 5.0

ensemble:
  method: weighted_logarithmic   # weighted_linear | weighted_logarithmic | stacking
  weight_search: dirichlet       # grid over simplex, log-loss objective
  n_weight_samples: 4000

calibration:
  method: isotonic               # isotonic | platt | none
  min_samples: 800

backtest:
  # Walk-forward: for each test season, train only on strictly earlier matches.
  first_test_season: 2015/16
  last_test_season: 2025/26
  validation_seasons: 2          # seasons before test used to fit blend weights + calibration
  burn_in_seasons: 3             # minimum history before a season can be tested
  refit_interval_days: 30        # statistical models refit this often within a season

features:
  form_windows: [3, 5, 10]
  time_decay_halflife_days: 180
  min_history_matches: 6
